name: Playwright API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  playwright-api-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install npm dependencies
      - name: Install Dependencies
        run: npm install

      # Install Playwright browsers and OS dependencies
      - name: Install Playwright
        run: npx playwright install --with-deps

      # Run Playwright API Tests
      - name: Run API Tests
        #run: npx playwright test
        run: npx playwright test tests/simpleGet.spec.ts
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

      # Upload Playwright HTML Report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4

        # Upload report even if tests fail
        if: always()

        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30